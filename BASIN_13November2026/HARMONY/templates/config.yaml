# BASIN / HARMONY normalization runner config
# Reuse-aware version

# -------------------------
# Run stamping
# -------------------------
run_root: outputs/runs
run_id: auto
run_id_prefix: my_experiment  # Optional prefix for the run directory name
append_run_stamp_to_prefix: true
write_run_manifest: true
write_checksums: false
allow_overwrite: false
tee_run_log: true

# -------------------------
# Core inputs
# -------------------------
samples_tsv: samples.tsv
universal_bed: anchor_files/dm6/IgG_consensus_fdr0p005_relaxed_90pct_filter_away_lt50bp.chr.bed

# -------------------------
# Reuse / resume behavior
# -------------------------
# bams_prepared: reuse already-prepared (markdup/dedup) BAMs instead of
# rebuilding them. This is the cluster-friendly way to avoid re-running the
# expensive duplicate-marking and deduplication steps. Point it at ANY directory
# of prepared BAMs -- most commonly the bams_prepared/ directory of a prior
# HARMONY run. Prepared BAM filenames must follow HARMONY's convention, derived
# from the ORIGINAL bam stem:
#     keep   mode:  <stem>.markdup.bam
#     remove mode:  <stem>.markdup.dedup.bam   (or <stem>.dedup.bam)
# Use an absolute path, or null to disable.
bams_prepared: null

# IMPORTANT: use an absolute path of the RUN DIRECTORY, null if not reusing.
# Note: the bigwigs_baseline subdirectory name will be added internally.
# When set, prepared BAMs from that run are also reused when available
# (after bams_prepared above, if both are set).
reuse_baseline_from_run: null
# true = copy prior-run baseline bigWigs into the new run
# false = symlink them
copy_reused_baseline_bw: true

# If a baseline bigWig is already present in the current run folder, reuse it
skip_baseline_if_present: true

# Skip samples/drop-fractions whose scale factor is NA instead of crashing
skip_samples_with_na_scale: true

# -------------------------
# Duplicate marking policy
# -------------------------
require_bai: true
mark_duplicates_if_missing: true
markdup_tool: samtools

# -------------------------
# Duplicate handling for coverage/scaling
# -------------------------
# remove = use deduplicated BAMs for coverage/scaling
# keep   = keep duplicates
dedup_mode: remove

# -------------------------
# Canonical coverage contract + optional downstream bigWigs
# -------------------------
# BAR quantification, the raw NONE scale basis, the canonical CPM track consumed
# by CODA, and the canonical BASIN-scaled bigWigs are ALWAYS:
#   binSize = 1
#   centerReads = false
#   extendReads = false
# These are properties of the BASIN measurement model, not user options.
#
# MAPQ remains configurable. MAPQ 0 matches discovery of the distributed dm6 BAR
# panel. HARMONY applies the same value to canonical NONE, CPM, and scaled tracks
# and records it in run_manifest/coverage_contract.tsv.
min_mapq: 0

# Optional derivative tracks. These NEVER feed BAR scaling or CODA.
make_downstream_cpm_bigwigs: false
make_downstream_scaled_bigwigs: false
downstream_center_reads: true
downstream_extend_reads: false
downstream_bin_size: 1
downstream_bw_dir: bigwigs_downstream

# Fragment-size filtering is distinct from read extension.
make_fragment_splits: false
split_threshold_bp: 120

# Prior runs created before coverage_contract.tsv cannot be machine-verified.
# Leave false unless you manually confirm 1-bp, uncentered, unextended coverage
# with the same min_mapq and dedup_mode.
allow_unverified_legacy_baseline_reuse: false

# Optional per-run subdirectories
baseline_bw_dir: bigwigs_baseline
scaled_bw_dir: bigwigs_scaled
scales_dir: scales
logs_dir: logs
signal_summary_dir: signal_summary
prepared_bam_dir: bams_prepared

# -------------------------
# Scaling factor computation
# -------------------------
drop_fractions: ["0.50", "0.35", "0.20", "0.10"]
